# Opt-in single-GPU MiniCPM-o 4.5 profile with NVIDIA MPS on CUDA.
# Same stages as minicpmo_4_5.yaml (duplex sessions plus chat completions).
# cuda_mps starts one private MPS daemon shared by the three co-located
# stages and stops it after they exit. Without MPS the Thinker, Talker and
# Code2Wav processes time-slice the GPU; with it their kernels can overlap.
# An existing CUDA_MPS_PIPE_DIRECTORY is reused without taking ownership.
# Requires nvidia-cuda-mps-control on PATH.
#
# Code2Wav, the stage that limits throughput from C=8 up, also gets:
# - token2wav_async_ref_prepare: a new request's reference voice is prepared
#   when its placeholder arrives (host half on a worker thread, device half
#   on a side stream) instead of inside the chunk-0 step that every live
#   stream waits on. Prompt features are bit-identical. CUDA only; other
#   platforms keep the idle prefetch.
# - micro_batch_size: 8 (default 4) and cfm_onset_merge: fewer, larger
#   Whole-Euler solves per step, with first chunks merged into the same solve.
#   These two apply on every platform; they were measured on CUDA only.
#
# Measured on one L20X at 6a56252e6 (Seed-TTS en voice cloning through
# /v1/chat/completions, 16 requests per concurrency slot), against the same
# profile with only cuda_mps: 1046 -> 1319 codec frames/s at C=32 (+26%),
# 834 -> 1018 at C=16 (+22%), 762 -> 869 at C=8 (+14%); C=1 unchanged.
# Seed-TTS WER (128 utterances, C=8): 1.55-1.67% over 5 runs without the
# Code2Wav options, 1.44-2.24% over 9 runs with them. Two borderline utterances
# failed in 3 of 6 runs, which fits the batching options changing rounding;
# validate on a larger set before relying on it. Duplex
# mean first audio at C=1/4/8 was unchanged; the C=8 p95 was about 9% higher
# in two runs.
# Upstream's opt-in cfm_float16 on top: +9% at C=32, WER within spread, but one
# duplex C=4 run was 20% slower.
#
# All stages become clients of one MPS server, so a fatal GPU fault in one
# stage can also take down the others on that GPU. A graceful shutdown
# (SIGINT/SIGTERM; about 15 s on L20X) stops the daemon; a hard kill (SIGKILL,
# OOM killer) leaves it running. Stop a leftover one with
#   echo quit | CUDA_MPS_PIPE_DIRECTORY=/tmp/vllm-omni-mps-<id>/pipe nvidia-cuda-mps-control
# Other platforms ignore cuda_mps.
base_config: minicpmo_4_5.yaml

connectors:
  connector_of_shared_memory:
    extra:
      token2wav_async_ref_prepare: true
      micro_batch_size: 8
      cfm_onset_merge: true

platforms:
  cuda:
    cuda_mps: true
